# Convert the detected camera coordinates with config/T_arm_camera.yaml and
# Publish target_point in the MyCobot base coordinate system.
output_frame: arm

# Depth-geometry detector settings. The ROI is the white work sheet shown in
# the 640 x 480 RealSense color image. Adjust it if the camera is moved.
detector:
  roi_xyxy: [80, 25, 510, 330]
  plane_sample_stride: 3
  plane_ransac_iterations: 150
  plane_distance_threshold_m: 0.006
  # The white sheet occupies most of the ROI but the targets and shadows are
  # excluded from the work-surface plane fit.
  min_plane_inlier_ratio: 0.35
  # The configured targets are 10, 15 or 25 mm above the fixed white work
  # surface.
  # The tolerance admits depth noise but rejects the sheet itself and the
  # taller MyCobot/conveyor parts.
  object_min_height_m: 0.007
  object_max_height_m: 0.030
  min_component_area_px: 50
  # At about 455 mm distance, the largest 30 x 30 mm face stays below this.
  max_component_area_px: 5000
  morphology_kernel_px: 3
  dimension_abs_tolerance_mm: 8.0
  dimension_relative_tolerance: 0.35
  # Allow moderate contour distortion from rounded corners and depth holes.
  min_rectangularity: 0.45
  # Five detections must form a position cluster within this radius. A moving
  # robot link or a one-frame reflection is therefore not published.
  stable_cluster_radius_m: 0.020
  # Candidate boundaries must be supported by both color and depth edges.
  color_canny_low_threshold: 60
  color_canny_high_threshold: 180
  depth_edge_threshold_m: 0.012
  edge_search_radius_px: 3
  min_color_edge_ratio: 0.04
  min_depth_edge_ratio: 0.04
  edge_confidence_weight: 0.10

# Cuboid dimensions_mm order is [width, length, height]. Cylinder dimensions
# are [diameter, diameter, height], a sphere is [diameter, diameter, diameter],
# and a regular hexagonal prism is [across-flats, across-flats, height].
# Matching is orientation-free.
targets:
  "[T1]":
    enabled: true
    dimensions_mm: [20.0, 20.0, 10.0]
    description: black 20 x 20 x 10 mm cuboid detected from its 20 x 20 mm face
    visible_face:
      dimensions_mm: [20.0, 20.0]
      shape: rectangle
      min_shape_confidence: 0.50
      shape_confidence_weight: 0.20
      absolute_tolerance_mm: 8.0
      relative_tolerance: 0.30
      confidence_weight: 0.35
      # With the camera pointing down, measure the horizontal top plane only.
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    # Camera-to-ground distance is 0.470 m. The 10 mm-high target surface is
    # therefore expected at 0.470 - 0.010 = 0.460 m.
    camera_distance:
      expected_m: 0.460
      # Accept 0.380 - 0.540 m to tolerate placement near the image edges and
      # small departures from a perfectly parallel work surface.
      tolerance_m: 0.080
      confidence_weight: 0.10
    # OpenCV HSV range for a matte black surface. Hue and saturation are
    # unrestricted; black is represented by low brightness (V).
    color:
      enabled: true
      hsv_lower: [0, 0, 0]
      hsv_upper: [179, 255, 80]
      min_ratio: 0.45
      confidence_weight: 0.25
    # The D435 may return no depth on the glossy/low-texture target. In that
    # case, measure the 20 x 20 mm color square and use the known top depth.
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.460
      confidence_threshold: 0.60

  "[T2]":
    enabled: true
    dimensions_mm: [25.0, 25.0, 25.0]
    description: blue sphere 25 mm in diameter, detected from its circular silhouette
    visible_face:
      dimensions_mm: [25.0, 25.0]
      shape: circle
      # A sphere has no planar top face, so measure its top-view silhouette.
      measurement: silhouette
      min_shape_confidence: 0.50
      shape_confidence_weight: 0.20
      absolute_tolerance_mm: 8.0
      relative_tolerance: 0.30
      confidence_weight: 0.35
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    camera_distance:
      # The top of a 25 mm sphere is 0.470 - 0.025 = 0.445 m away.
      expected_m: 0.445
      tolerance_m: 0.080
      confidence_weight: 0.10
    # OpenCV HSV range for a blue surface.
    color:
      enabled: true
      hsv_lower: [90, 100, 70]
      hsv_upper: [135, 255, 255]
      min_ratio: 0.35
      confidence_weight: 0.40
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.445
      confidence_threshold: 0.60

  "[T3]":
    enabled: true
    dimensions_mm: [25.0, 25.0, 15.0]
    description: pink regular hexagonal prism 25 mm across flats and 15 mm high, detected from its hexagonal face
    visible_face:
      # The value is the distance between each pair of opposite edges.
      dimensions_mm: [25.0, 25.0]
      shape: hexagon
      min_shape_confidence: 0.65
      shape_confidence_weight: 0.20
      absolute_tolerance_mm: 8.0
      relative_tolerance: 0.30
      confidence_weight: 0.35
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    camera_distance:
      expected_m: 0.455
      tolerance_m: 0.080
      confidence_weight: 0.10
    color:
      enabled: true
      # Pink can be relatively low in saturation under bright illumination.
      hsv_lower: [145, 40, 100]
      hsv_upper: [179, 255, 255]
      min_ratio: 0.35
      confidence_weight: 0.40
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.455
      confidence_threshold: 0.60

  "[T4]":
    enabled: true
    dimensions_mm: [30.0, 30.0, 15.0]
    description: red cylinder 30 mm in diameter and 15 mm high, detected from its circular face
    visible_face:
      dimensions_mm: [30.0, 30.0]
      shape: circle
      min_shape_confidence: 0.50
      shape_confidence_weight: 0.20
      absolute_tolerance_mm: 8.0
      relative_tolerance: 0.30
      confidence_weight: 0.35
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    camera_distance:
      expected_m: 0.455
      tolerance_m: 0.080
      confidence_weight: 0.10
    color:
      enabled: true
      hsv_ranges:
        - lower: [0, 100, 70]
          upper: [12, 255, 255]
        - lower: [168, 100, 70]
          upper: [179, 255, 255]
      min_ratio: 0.35
      confidence_weight: 0.40
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.455
      confidence_threshold: 0.60
