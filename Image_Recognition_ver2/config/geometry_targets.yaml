# Convert the detected camera coordinates with config/T_arm_camera.yaml and
# Publish target_point in the MyCobot base coordinate system.
output_frame: arm

# Depth-geometry detector settings. The ROI covers the plain white work sheet
# shown by the 640 x 480 RealSense image. Its color is excluded by the target
# HSV masks; RANSAC estimates its dominant depth plane before raised components
# are evaluated. Adjust the ROI whenever the camera or sheet is moved.
detector:
  roi_xyxy: [80, 25, 510, 330]
  plane_sample_stride: 3
  plane_ransac_iterations: 150
  plane_distance_threshold_m: 0.006
  # The white sheet occupies most of the ROI but targets, shadows and small
  # depth irregularities are excluded from the work-surface plane fit.
  min_plane_inlier_ratio: 0.35
  # The configured targets are 10, 15 or 25 mm above the estimated sheet.
  # The tolerance admits depth noise but rejects the sheet itself and the
  # taller MyCobot/conveyor parts.
  object_min_height_m: 0.007
  object_max_height_m: 0.030
  min_component_area_px: 50
  # At about 455 mm distance, the largest 30 x 30 mm face stays below this.
  max_component_area_px: 5000
  morphology_kernel_px: 3
  dimension_abs_tolerance_mm: 8.0
  dimension_relative_tolerance: 0.35
  # Allow moderate contour distortion from rounded corners and depth holes.
  min_rectangularity: 0.45
  # Five detections must form a position cluster within this radius. A moving
  # robot link or a one-frame reflection is therefore not published.
  stable_cluster_radius_m: 0.020
  # Candidate boundaries must be supported by both color and depth edges.
  # A low threshold is needed for a black target whose brightness is close to
  # the gray ground. Shape, size and depth still reject ground texture.
  color_canny_low_threshold: 25
  color_canny_high_threshold: 100
  depth_edge_threshold_m: 0.012
  edge_search_radius_px: 3
  min_color_edge_ratio: 0.04
  min_depth_edge_ratio: 0.04
  edge_confidence_weight: 0.10

# Cuboid dimensions_mm order is [width, length, height]. A sphere is
# [diameter, diameter, diameter], and a regular hexagonal prism is
# [across-flats, across-flats, height].
# Matching is orientation-free.
targets:
  "[T1]":
    enabled: true
    dimensions_mm: [20.0, 20.0, 10.0]
    description: black 20 x 20 x 10 mm cuboid detected from its 20 x 20 mm face
    visible_face:
      dimensions_mm: [20.0, 20.0]
      shape: rectangle
      min_shape_confidence: 0.40
      shape_confidence_weight: 0.20
      absolute_tolerance_mm: 8.0
      relative_tolerance: 0.30
      confidence_weight: 0.35
      # With the camera pointing down, measure the horizontal top plane only.
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    # Camera-to-ground distance is 0.470 m. The 10 mm-high target surface is
    # therefore expected at 0.470 - 0.010 = 0.460 m.
    camera_distance:
      expected_m: 0.460
      # Accept 0.380 - 0.540 m to tolerate placement near the image edges and
      # small departures from a perfectly parallel work surface.
      tolerance_m: 0.080
      confidence_weight: 0.10
    # OpenCV HSV range for a matte black surface. Hue and saturation are
    # unrestricted; black is represented by low brightness (V).
    color:
      enabled: true
      hsv_lower: [0, 0, 0]
      hsv_upper: [179, 255, 80]
      # The camera image shows the black top around V=89..110 while the ground
      # is around V=110..126. Add pixels that are darker than the current ROI
      # reference instead of raising the absolute black limit for the ground.
      adaptive_dark:
        enabled: true
        reference_percentile: 60
        min_contrast_v: 12
        max_v: 115
        max_saturation: 100
      mask_repair_kernel_px: 7
      fill_holes: true
      min_ratio: 0.25
      confidence_weight: 0.25
    # The D435 may return no depth on the glossy/low-texture target. In that
    # case, measure the 20 x 20 mm color square and use the known top depth.
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.460
      confidence_threshold: 0.55

  "[T2]":
    enabled: true
    dimensions_mm: [25.0, 25.0, 25.0]
    description: blue sphere 25 mm in diameter, detected from its circular silhouette
    visible_face:
      dimensions_mm: [25.0, 25.0]
      shape: circle
      # A sphere has no planar top face, so measure its top-view silhouette.
      measurement: silhouette
      min_shape_confidence: 0.50
      shape_confidence_weight: 0.20
      absolute_tolerance_mm: 8.0
      relative_tolerance: 0.30
      confidence_weight: 0.35
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    camera_distance:
      # The top of a 25 mm sphere is 0.470 - 0.025 = 0.445 m away.
      expected_m: 0.445
      tolerance_m: 0.080
      confidence_weight: 0.10
    # OpenCV HSV range for a blue surface.
    color:
      enabled: true
      hsv_lower: [90, 100, 70]
      hsv_upper: [135, 255, 255]
      min_ratio: 0.35
      confidence_weight: 0.40
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.445
      confidence_threshold: 0.60

  "[T3]":
    enabled: true
    dimensions_mm: [25.0, 25.0, 15.0]
    description: pink regular hexagonal prism 25 mm across flats and 15 mm high, detected from its hexagonal face
    visible_face:
      # The value is the distance between each pair of opposite edges.
      dimensions_mm: [25.0, 25.0]
      shape: hexagon
      # A hexagon is also fairly circular, so it must beat the circle score.
      reject_shapes: [circle]
      # Accept moderately incomplete corners across consecutive frames while
      # still requiring the hexagon score to beat the circle score.
      min_shape_margin: 0.02
      min_shape_confidence: 0.45
      shape_confidence_weight: 0.20
      # Keep the 25 mm T3 face separate from the 30 mm T4 face.
      absolute_tolerance_mm: 5.0
      relative_tolerance: 0.20
      confidence_weight: 0.35
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    camera_distance:
      expected_m: 0.455
      tolerance_m: 0.080
      confidence_weight: 0.10
    color:
      enabled: true
      # The supplied camera image places pink near H=164. Keep this range
      # disjoint from T4 red (H=0/177) so the targets cannot share a color mask.
      hsv_lower: [145, 35, 75]
      hsv_upper: [169, 255, 255]
      mask_repair_kernel_px: 7
      fill_holes: true
      min_ratio: 0.30
      confidence_weight: 0.45
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.455
      confidence_threshold: 0.60

  "[T4]":
    enabled: true
    dimensions_mm: [30.0, 30.0, 15.0]
    description: red 30 x 30 x 15 mm cuboid detected from its 30 x 30 mm face
    visible_face:
      dimensions_mm: [30.0, 30.0]
      shape: rectangle
      # Require the square top to beat both round alternatives. Together with
      # the 30 x 30 mm dimensions, this separates T4 from T2 and T3, while its
      # disjoint red HSV range separates it from the smaller black square T1.
      reject_shapes: [circle, hexagon]
      min_shape_margin: 0.10
      min_shape_confidence: 0.65
      shape_confidence_weight: 0.25
      # Keep the 30 mm T4 face separate from the 25 mm T3 face.
      absolute_tolerance_mm: 4.0
      relative_tolerance: 0.15
      confidence_weight: 0.35
      plane_ransac_iterations: 100
      plane_distance_threshold_m: 0.004
      min_plane_inlier_ratio: 0.30
    camera_distance:
      expected_m: 0.455
      tolerance_m: 0.080
      confidence_weight: 0.10
    color:
      enabled: true
      hsv_ranges:
        - lower: [0, 110, 80]
          upper: [10, 255, 255]
        - lower: [173, 110, 80]
          upper: [179, 255, 255]
      # Repair small glare holes before measuring the square silhouette. The
      # white sheet remains outside this high-saturation red mask.
      mask_repair_kernel_px: 5
      fill_holes: true
      min_ratio: 0.45
      confidence_weight: 0.45
    color_fixed_depth_fallback:
      enabled: true
      camera_distance_m: 0.455
      confidence_threshold: 0.70
